# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "nuget" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # The compile reference sets the minimum PowerShell (7.4, net8.0); newer versions drop 7.4 and 7.5.
      - dependency-name: "System.Management.Automation"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # 11.x packages no longer support net8.0, which PowerShell 7.4 runs on.
      - dependency-name: "System.Text.Encoding.CodePages"
        versions: [">= 11"]
      - dependency-name: "System.Security.Cryptography.Pkcs"
        versions: [">= 11"]
